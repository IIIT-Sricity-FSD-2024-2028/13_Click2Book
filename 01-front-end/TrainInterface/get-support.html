<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Support | Click2Book</title>
    
    
    <link rel="stylesheet" href="user-styles.css">
    <link rel="stylesheet" href="user-dashboard.css">
    <style>
        .page-header-center { text-align: center; margin-bottom: 2rem; margin-top: 1rem; }
        .page-header-center h2 { font-size: 1.5rem; font-weight: 800; color: #111827; margin: 0 0 0.25rem 0; }
        .page-header-center p { font-size: 0.875rem; color: #6B7280; margin: 0; }
        
        .gs-form-wrapper { max-width: 600px; margin: 0 auto; }
        
        .gs-card {
            background: white; border: 1px solid #E5E7EB; border-radius: 12px;
            padding: 2rem; margin-bottom: 1.5rem;
        }
        
        .gs-label { font-size: 0.875rem; font-weight: 700; color: #111827; margin-bottom: 1rem; display: block; }
        
        .category-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
        }
        
        .category-btn {
            background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 8px;
            padding: 0.875rem 1rem; display: flex; align-items: center; gap: 0.75rem;
            cursor: pointer; transition: all 0.2s; font-size: 0.875rem; font-weight: 500; color: #475569;
        }
        .category-btn svg { width: 16px; height: 16px; color: #9CA3AF; }
        
        .category-btn.active {
            background: #FFF7ED; border-color: var(--primary); color: var(--primary);
        }
        .category-btn.active svg { color: var(--primary); }
        
        .gs-input {
            width: 100%; box-sizing: border-box; border: 1px solid #E2E8F0; border-radius: 8px;
            padding: 1rem; font-size: 0.875rem; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            background: #F8FAFC; color: #111827; transition: border-color 0.2s; margin-bottom: 1rem;
        }
        .gs-input:focus { outline: none; border-color: var(--primary); background: white; }
        .gs-input::placeholder { color: #9CA3AF; }
        
        .gs-textarea {
            width: 100%; box-sizing: border-box; border: 1px solid #E2E8F0; border-radius: 8px;
            padding: 1rem; font-size: 0.875rem; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            background: #F8FAFC; color: #111827; transition: border-color 0.2s; min-height: 120px; resize: vertical;
        }
        .gs-textarea:focus { outline: none; border-color: var(--primary); background: white; }
        .gs-textarea::placeholder { color: #9CA3AF; }
        
        .gs-submit {
            width: 100%; border: none; border-radius: 8px; background: var(--primary); color: white;
            padding: 1rem; font-size: 1rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            cursor: pointer; transition: background 0.2s;
        }
        .gs-submit:hover { background: var(--primary-hover); }
        
    </style>
</head>
<body>
    <div class="user-dash-layout">
        <aside class="user-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="icon"><svg style="color: white; width: 18px; height: 18px;" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg></div>
                    <div class="text">CLICK<span style="color:var(--primary);">2</span>BOOK</div>
                </div>
                <svg style="color: white; cursor: pointer;" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </div>
            
            <div class="sidebar-profile">
                <div class="avatar">RS</div>
                <div class="info">
                    <h4>Customer Profile</h4>
                    <p>Premium Member</p>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="search-trains.html" class="nav-link nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg> Search Trips
                </a>
                <a href="my-bookings.html" class="nav-link nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg> My Bookings
                </a>
                <a href="cancel-ticket.html" class="nav-link nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg> Cancel Ticket
                </a>
                <a href="get-support.html" class="nav-link nav-item active">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"></path><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path></svg> Get Support
                </a>
                <a href="my-profile.html" class="nav-link nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg> My Profile
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <a href="login train.html" class="nav-link nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg> Logout
                </a>
            </div>
        </aside>
        
        <div class="user-main-content">
            <div class="top-header">
                <div class="page-titles">
                    <h1>Get Support</h1>
                    <p>Welcome back, Rahul!</p>
                </div>
                <div class="notification-bell">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                </div>
            </div>
            
            <div class="dashboard-wrapper">
                <div class="page-header-center">
                    <h2>Request Assistance</h2>
                    <p>Our team is here to help you 24/7</p>
                </div>
                
                <div class="gs-form-wrapper">
                    <div class="gs-card" style="margin-bottom: 1rem;">
                        <label class="gs-label">Issue Category</label>
                        <div class="category-grid">
                            <div class="category-btn active">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg> Booking Issue
                            </div>
                            <div class="category-btn">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg> Refund
                            </div>
                            <div class="category-btn">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> Complaint
                            </div>
                            <div class="category-btn">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg> Other
                            </div>
                        </div>
                    </div>
                    
                    <div class="gs-card" style="padding: 1.5rem 2rem;">
                        <input type="text" class="gs-input" placeholder="Booking ID (optional)">
                        <textarea class="gs-textarea" placeholder="Describe your issue in detail..."></textarea>
                    </div>
                    
                    <button class="gs-submit">
                        <svg style="width: 18px; height: 18px;" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"></path><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path></svg> Submit Request
                    </button>
                </div>
                
            </div>
        </div>
    </div>
    
</body>
</html>
