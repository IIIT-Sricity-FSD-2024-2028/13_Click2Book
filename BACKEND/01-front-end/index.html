<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=landing%20page/index.html" />
  <title>Click2Book – Redirecting…</title>
  <style>
    body {
      margin: 0;
      background: #0a1628;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
    }
    .loader {
      text-align: center;
    }
    .logo {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }
    .logo span { color: #f97316; }
    .sub { font-size: 0.9rem; color: rgba(255,255,255,0.5); margin-bottom: 24px; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(249,115,22,0.3);
      border-top-color: #f97316;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader">
    <div class="logo">CLICK<span>2</span>BOOK</div>
    <div class="sub">Loading your journey…</div>
    <div class="spinner"></div>
  </div>
  <script>
    // Redirect to landing page
    setTimeout(() => {
      window.location.href = 'landing%20page/index.html';
    }, 300);
  </script>
</body>
</html>
