<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Confirmed – Click2Book</title>
  <meta name="description" content="Your bus ticket has been booked successfully on Click2Book." />
  
  
  
  <link rel="stylesheet" href="common.css" />
  <style>
    /* ── Page centering ── */
    body {
      background: linear-gradient(135deg, #0B2447 0%, #19376D 60%, #f97316 200%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }

    .confirm-wrap {
      width: 100%;
      max-width: 560px;
    }

    /* ── Brand header ── */
    .brand-bar {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-bar .logo-text {
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .brand-bar .logo-accent { color: #f97316; }

    /* ── Card ── */
    .confirm-card {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    /* Green success top strip */
    .success-top {
      background: linear-gradient(135deg, #16a34a 0%, #22c55e 100%);
      padding: 36px 32px 28px;
      text-align: center;
      position: relative;
    }
    .success-top::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0; right: 0;
      height: 28px;
      background: #fff;
      border-radius: 28px 28px 0 0;
    }

    .tick-ring {
      width: 76px; height: 76px;
      background: rgba(255,255,255,0.2);
      border: 3px solid rgba(255,255,255,0.5);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      animation: popIn .55s cubic-bezier(.34,1.56,.64,1) both;
    }
    .tick-ring svg { color: white; }
    @keyframes popIn {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    .success-top h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: white;
      margin: 0 0 6px;
    }
    .success-top p {
      font-size: .88rem;
      color: rgba(255,255,255,0.85);
      margin: 0;
    }

    /* Card body */
    .card-body {
      padding: 28px 32px 32px;
    }

    /* Booking ID badge */
    .booking-id-badge {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 22px;
    }
    .bid-label {
      font-size: .72rem;
      font-weight: 700;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .bid-value {
      font-size: 1rem;
      font-weight: 800;
      color: #0B2447;
      font-family: 'Courier New', monospace;
      letter-spacing: 1px;
    }
    .bid-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #dcfce7;
      color: #16a34a;
      font-size: .72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 50px;
    }

    /* Detail grid */
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 22px;
    }
    .detail-item {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px 14px;
    }
    .detail-item .d-label {
      font-size: .65rem;
      font-weight: 700;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin: 0 0 4px;
    }
    .detail-item .d-value {
      font-size: .9rem;
      font-weight: 700;
      color: #111827;
      margin: 0;
      word-break: break-all;
    }
    .detail-item.full { grid-column: 1 / -1; }

    /* Amount banner */
    .amount-banner {
      background: linear-gradient(135deg, #0B2447 0%, #19376D 100%);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }
    .amount-banner .ab-label { font-size: .82rem; color: rgba(255,255,255,.7); font-weight: 500; }
    .amount-banner .ab-value { font-size: 1.4rem; font-weight: 800; color: #f97316; }

    /* Action buttons */
    .action-row {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
    }
    .btn-primary-c {
      flex: 2;
      padding: 14px;
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      font-size: .9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: transform .2s, box-shadow .2s;
      box-shadow: 0 6px 20px rgba(249,115,22,.35);
    }
    .btn-primary-c:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(249,115,22,.45); }
    .btn-secondary-c {
      flex: 1;
      padding: 14px;
      background: #f1f5f9;
      color: #475569;
      border: none;
      border-radius: 10px;
      font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      font-size: .9rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background .2s;
    }
    .btn-secondary-c:hover { background: #e2e8f0; }

    /* Home link */
    .home-link {
      text-align: center;
      padding-top: 6px;
    }
    .home-link a {
      font-size: .8rem;
      color: #6b7280;
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: color .15s;
    }
    .home-link a:hover { color: #f97316; }

    /* Confetti animation strip */
    .confetti-strip {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .confetti-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #16a34a;
      font-size: .72rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 50px;
      animation: fadeUp .4s ease both;
    }
    .confetti-chip:nth-child(2) { animation-delay: .1s; }
    .confetti-chip:nth-child(3) { animation-delay: .2s; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="confirm-wrap">
    <!-- Brand -->
    <div class="brand-bar">
      <span class="logo-text">CLICK<span class="logo-accent">2</span>BOOK</span>
    </div>

    <div class="confirm-card">
      <!-- Success top -->
      <div class="success-top">
        <div class="tick-ring">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <h1>Booking Confirmed! 🎉</h1>
        <p>Your bus ticket has been booked successfully</p>
      </div>

      <!-- Card body -->
      <div class="card-body">

        <!-- Status chips -->
        <div class="confetti-strip">
          <span class="confetti-chip">✅ Ticket Booked</span>
          <span class="confetti-chip">💳 Payment Successful</span>
          <span class="confetti-chip">📧 E-Ticket Sent</span>
        </div>

        <!-- Booking ID -->
        <div class="booking-id-badge">
          <div>
            <div class="bid-label">Booking ID</div>
            <div class="bid-value" id="bcBookingId">—</div>
          </div>
          <span class="bid-status">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
            CONFIRMED
          </span>
        </div>

        <!-- Details grid -->
        <div class="detail-grid">
          <div class="detail-item full">
            <p class="d-label">Route</p>
            <p class="d-value" id="bcRoute">—</p>
          </div>
          <div class="detail-item">
            <p class="d-label">Bus</p>
            <p class="d-value" id="bcBus">—</p>
          </div>
          <div class="detail-item">
            <p class="d-label">Type</p>
            <p class="d-value" id="bcType">—</p>
          </div>
          <div class="detail-item">
            <p class="d-label">Seats</p>
            <p class="d-value" id="bcSeats">—</p>
          </div>
          <div class="detail-item">
            <p class="d-label">Journey Date</p>
            <p class="d-value" id="bcDate">—</p>
          </div>
          <div class="detail-item">
            <p class="d-label">Payment</p>
            <p class="d-value" id="bcPayment">—</p>
          </div>
        </div>

        <!-- Amount -->
        <div class="amount-banner">
          <span class="ab-label">Total Amount Paid</span>
          <span class="ab-value" id="bcTotal">—</span>
        </div>

        <!-- Actions -->
        <div class="action-row">
          <a href="my-bookings.html" class="btn-primary-c">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            View My Bookings
          </a>
          <button class="btn-secondary-c" onclick="window.print()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
            Print
          </button>
        </div>

        <div class="home-link">
          <a href="../landing page/index.html">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            Back to Home
          </a>
        </div>

      </div>
    </div>
  </div>

  <!-- ═══ CRUD Engine ═══ -->
  <script src="../crud functions/js/mock_data.js"></script>
  <script src="../crud functions/js/script.js"></script>
  <script src="../crud functions/js/ui-shared.js"></script>
  <script src="../crud functions/js/ui-customer.js"></script>

  <script>
    /* ── Populate confirmation details from sessionStorage ── */
    window.addEventListener('DOMContentLoaded', function() {
      const id      = sessionStorage.getItem('lastBookingId')  || '—';
      const bus     = sessionStorage.getItem('lastBusName')    || '—';
      const type    = sessionStorage.getItem('lastBusType')    || '—';
      const seats   = sessionStorage.getItem('lastSeats')      || '—';
      const total   = sessionStorage.getItem('lastTotal')      || '0';
      const from    = sessionStorage.getItem('lastFrom')        || '—';
      const to      = sessionStorage.getItem('lastTo')          || '—';
      const date    = sessionStorage.getItem('lastDate')        || '—';
      const method  = sessionStorage.getItem('lastPayMethod')  || 'UPI';

      document.getElementById('bcBookingId').textContent = id;
      document.getElementById('bcRoute').textContent     = from + ' → ' + to;
      document.getElementById('bcBus').textContent       = bus;
      document.getElementById('bcType').textContent      = type;
      document.getElementById('bcSeats').textContent     = seats;
      document.getElementById('bcDate').textContent      = date;
      document.getElementById('bcPayment').textContent   = method;
      document.getElementById('bcTotal').textContent     = '₹' + Number(total).toLocaleString('en-IN');
    });
  </script>

</body>
</html>
