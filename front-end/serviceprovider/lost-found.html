        <!-- Main Content -->

            <div class="dash-content-wrapper">

    <script>
        var _spHost = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
                    ? 'localhost' : window.location.hostname;
        var _spApi  = 'http://' + _spHost + ':3000/api';
        var _spProviderId = sessionStorage.getItem('c2b_loggedInId') || localStorage.getItem('c2b_loggedInId') || 'P001';

        async function spFetch(path, options) {
            options = options || {};
            var res = await fetch(_spApi + path, Object.assign({
                headers: Object.assign({ 'Content-Type': 'application/json', 'x-role': 'PROVIDER' }, options.headers || {}),
            }, options));
            var json = await res.json();
            if (!json.success) throw new Error(json.message || 'Request failed');
            return json.data;
        }

        var STATUS_BADGE = { REPORTED: 'badge-orange', FOUND: 'badge-blue', RETURNED: 'badge-green', CLOSED: 'badge-purple' };

        function reportCard(item) {
            var isOpen = item.status === 'REPORTED' || item.status === 'FOUND';
            var actions = isOpen
                ? '<div class="lf-actions">' +
                    (item.status === 'REPORTED' ? '<button class="btn-outline-danger" style="color:#2563eb;border-color:#bfdbfe;" onclick="markStatus(\'' + item.itemId + '\',\'FOUND\')">Mark Found</button>' : '') +
                    '<button class="btn-outline-danger" style="color:#16a34a;border-color:#a7f3d0;" onclick="markStatus(\'' + item.itemId + '\',\'RETURNED\')">Mark Returned</button>' +
                    '<button class="btn-outline-danger" onclick="markStatus(\'' + item.itemId + '\',\'CLOSED\')">Close</button>' +
                  '</div>' +
                  '<input class="lf-note-input" id="note-' + item.itemId + '" placeholder="Add a note (e.g. where it is held)" />'
                : '';

            return '<div class="list-card" style="flex-direction:column;align-items:stretch;">' +
                '<div class="card-left" style="width:100%;">' +
                    '<div class="card-title">' + item.itemDescription + ' <span class="badge ' + (STATUS_BADGE[item.status] || 'badge-orange') + '">' + item.status + '</span></div>' +
                    '<div class="card-meta">' +
                        '<div class="card-meta-item">Trip ' + item.tripId + ' &middot; Booking ' + item.bookingId + '</div>' +
                        '<div class="card-meta-item">Lost on ' + item.dateLost + ' &middot; Contact: ' + item.contactPhone + '</div>' +
                    '</div>' +
                    (item.foundNote ? '<div class="card-meta-item" style="margin-top:6px;">Note: ' + item.foundNote + '</div>' : '') +
                    actions +
                '</div>' +
            '</div>';
        }

        window.markStatus = async function(itemId, status) {
            var noteInput = document.getElementById('note-' + itemId);
            var foundNote = noteInput ? noteInput.value.trim() : '';
            try {
                await spFetch('/lost-found/' + itemId + '/status', {
                    method: 'PATCH',
                    body: JSON.stringify({ status: status, foundNote: foundNote || undefined }),
                });
                loadReports();
            } catch (e) { alert('Could not update report: ' + e.message); }
        };

        async function loadReports() {
            var container = document.getElementById('providerLostFoundList');
            try {
                var items = await spFetch('/lost-found/provider/' + encodeURIComponent(_spProviderId));
                if (!items.length) {
                    container.innerHTML = '<div class="list-card"><div class="card-left"><div class="card-title">No lost &amp; found reports on your trips.</div></div></div>';
                    return;
                }
                container.innerHTML = items.slice().reverse().map(reportCard).join('');
            } catch (e) {
                container.innerHTML = '<div class="list-card"><div class="card-left"><div class="card-title">Could not load reports — backend may be offline.</div></div></div>';
            }
        }

        loadReports();
    </script>
