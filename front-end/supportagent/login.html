<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Login – Click2Book Support (React)</title>
  <link rel="stylesheet" href="dist/bundle.css?v=2.2" />
  <link rel="stylesheet" href="src/index.css?v=2.2" />
</head>
<body>
  <div id="root"></div>

  <script>
    // Ensure route is set to login view
    if (!window.location.hash || window.location.hash !== '#login') {
      window.location.hash = 'login';
    }
  </script>

  <!-- React 19 Bundle -->
  <script src="dist/bundle.js?v=2.2"></script>

  <script type="module">
    if (!window.__REACT_BUNDLE_LOADED__ && window.location.port === '5173') {
      import('/src/main.jsx');
    }
  </script>
</body>
</html>
